```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Library Management</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="login-container">
        <div class="login-box">

            <h1>📚 Student Login</h1>
            <p>Welcome back! Login to your library account.</p>

            {% if error %}
                <p style="color: red;">{{ error }}</p>
            {% endif %}

            {% if success %}
                <p style="color: green;">{{ success }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('student_login') }}">

                <input
                    type="text"
                    name="username"
                    placeholder="Student Username"
                    autocomplete="username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p>
                Don't have an account?
                <a href="{{ url_for('signup') }}">Create Account</a>
            </p>

            <p>
                Are you an admin?
                <a href="{{ url_for('login') }}">Admin Login</a>
            </p>

        </div>
    </div>

</body>
</html>
```
