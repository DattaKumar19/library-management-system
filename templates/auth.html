<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071b3a, #174b83);
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        .heading {
            text-align: center;
            color: #102c50;
            margin-bottom: 25px;
        }

        .heading h1 {
            margin-bottom: 8px;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 25px;
            background: #eaf0f7;
            padding: 5px;
            border-radius: 9px;
        }

        .tab {
            flex: 1;
            border: none;
            padding: 12px 5px;
            cursor: pointer;
            border-radius: 7px;
            background: transparent;
            color: #17385f;
            font-weight: bold;
            font-size: 12px;
        }

        .tab.active {
            background: #123b6d;
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form h2 {
            color: #123b6d;
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #174b83;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #123b6d;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #20558f;
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
        }

        .error {
            color: #dc3545;
        }

        .success {
            color: #198754;
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="heading">
        <h1>📚 Library Management</h1>
        <p>Welcome! Please choose your account type.</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('admin', this)">
            Admin
        </button>

        <button class="tab" onclick="showTab('student', this)">
            Student Login
        </button>

        <button class="tab" onclick="showTab('signup', this)">
            Signup
        </button>
    </div>

    {% if error %}
        <p class="message error">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p class="message success">{{ success }}</p>
    {% endif %}

    <!-- ADMIN LOGIN -->
    <form id="admin" class="auth-form active"
          method="POST" action="{{ url_for('login') }}">

        <h2>🔐 Admin Login</h2>

        <input type="text" name="username"
               placeholder="Admin Username" required>

        <input type="password" name="password"
               placeholder="Admin Password" required>

        <button type="submit" class="submit-btn">
            Admin Login
        </button>
    </form>

    <!-- STUDENT LOGIN -->
    <form id="student" class="auth-form"
          method="POST" action="{{ url_for('student_login') }}">

        <h2>🎓 Student Login</h2>

        <input type="text" name="username"
               placeholder="Student Username" required>

        <input type="password" name="password"
               placeholder="Password" required>

        <button type="submit" class="submit-btn">
            Student Login
        </button>
    </form>

    <!-- STUDENT SIGNUP -->
    <form id="signup" class="auth-form"
          method="POST" action="{{ url_for('signup') }}">

        <h2>📝 Create Student Account</h2>

        <input type="text" name="full_name"
               placeholder="Full Name" required>

        <input type="email" name="email"
               placeholder="Email Address" required>

        <input type="text" name="username"
               placeholder="Create Username" required>

        <input type="password" name="password"
               placeholder="Create Password (minimum 8 characters)"
               minlength="8" required>

        <input type="password" name="confirm_password"
               placeholder="Confirm Password" required>

        <button type="submit" class="submit-btn">
            Create Account
        </button>
    </form>

</div>

<script>
    function showTab(tabName, button) {

        document.querySelectorAll('.auth-form').forEach(form => {
            form.classList.remove('active');
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });

        document.getElementById(tabName).classList.add('active');
        button.classList.add('active');
    }

    // Open the correct tab after a form submission.
    const activeTab = "{{ active_tab|default('admin') }}";

    const tabButton = Array.from(
        document.querySelectorAll('.tab')
    ).find(button =>
        button.getAttribute('onclick').includes("'" + activeTab + "'")
    );

    if (tabButton) {
        showTab(activeTab, tabButton);
    }
</script>

</body>
</html>
